[package]
name = "whippyflight-betaflight"
version = "0.1.0"
edition = "2024"
authors = ["Oblarg"]
license = "GPL-3.0-or-later"
description = "Betaflight adapter for whippyflight-control: the C ABI the firmware glue calls"
publish = false

[lib]
name = "whippyflight_betaflight"
crate-type = ["staticlib", "lib"]

[dependencies]
# The firmware-agnostic controller.
whippyflight-control = "0.1.0"
whippyunits = { version = "0.3.5", default-features = false }
libm = "0.2"
bytemuck = { version = "1", default-features = false }

[features]
default = []
# Host-side testing (cargo test on the host target).
std = ["whippyflight-control/std", "whippyunits/std", "airframe-drag"]
# See whippyflight-control's feature of the same name.
airframe-drag = ["whippyflight-control/airframe-drag"]
[profile.release]
opt-level = "s"    # optimize for size on embedded
lto = true
codegen-units = 1
panic = "abort"

# The firmware build (mk/whippyflight.mk) builds release for the MCU's
# target; `cargo test --features std` runs the tests on the host.
