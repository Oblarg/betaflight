[package]
name = "whippyflight-control"
version = "0.1.0"
edition = "2024"
authors = ["Oblarg"]
license = "GPL-3.0-or-later"
description = "LQR flight control stack for Betaflight, powered by whippyunits + whippyalgebra"

[lib]
name = "whippyflight_control"
crate-type = ["staticlib", "lib"]

[dependencies]
# Unit-safe quantities — no_std, no alloc
# NOTE: path deps point at the local whippyunits checkout for development.
# Switch back to git deps for release/CI.
whippyunits = { path = "../../../../../whippyunits", default-features = false }
# Unit-safe linear algebra over nalgebra — no_std, no alloc
whippyalgebra = { path = "../../../../../whippyunits/whippyalgebra", default-features = false, features = ["nalgebra"] }

[dev-dependencies]
# Eval plant reads gen_wfg's coefficient JSON.
serde_json = "1"

[features]
default = []
# Enable std for host-side testing (cargo test on x86); host builds always
# carry the airframe drag mode so the tests and evals exercise it.
std = ["whippyunits/std", "whippyalgebra/std", "airframe-drag"]
# Compensate the rotor-drag torque of tall frames from the accelerometer
# when the blob has a drag block (v7).  Off by default: small frames don't
# need it, and without it the block is parsed but ignored.
airframe-drag = []

[profile.release]
opt-level = "s"    # optimize for size on embedded
lto = true
codegen-units = 1
panic = "abort"

# panic = "abort" for dev is set via .cargo/config.toml for embedded builds;
# omitted here so `cargo test` on host can use the default unwinding harness.
