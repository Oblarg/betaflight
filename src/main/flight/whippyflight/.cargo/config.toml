[build]
# Default target for `cargo build` — ARMv7E-M with hardware float.
# Covers Cortex-M4F (STM32F411) and Cortex-M7F (STM32F7/H7) — same ISA.
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = [
    # Use the cortex-m-rt linker script sections (data, bss, etc.)
    # BF provides its own linker script, so we just produce a static lib
    "-C", "link-arg=-nostartfiles",
]
